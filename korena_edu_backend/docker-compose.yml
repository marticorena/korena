services:
  django-app:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/django-app
      - ./static:/django-app/static/
      - ./media:/django-app/media/
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis
    networks:
      - django-app-network

  celery-worker:
    build: .
    command: celery -A config worker --loglevel=info -Q backend
    volumes:
      - .:/django-app
    env_file:
      - .env
    depends_on:
      - django-app
      - redis
    networks:
      - django-app-network

  celery-beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/django-app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - django-app-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - django-app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./static:/static/
      - ./media:/media/
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django-app
    networks:
      - django-app-network

  redis:
    image: redis:7
    container_name: redis
    networks:
      - django-app-network

volumes:
  postgres_data:

networks:
  django-app-network:
    external: true
