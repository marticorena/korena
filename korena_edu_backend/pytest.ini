[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
norecursedirs = .* build dist node_modules venv .venv htmlcov migrations
addopts = -vv --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=html --cov-branch --no-cov-on-fail --reuse-db
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow (skipped by default)
