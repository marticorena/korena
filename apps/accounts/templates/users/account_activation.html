<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IntiGear - Activa tu cuenta </title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            background-color: #F5F5F7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        .header {
            background: #ffffff;
            color: #0B2638;
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        .content {
            padding: 32px;
            text-align: center;
            color: #111827;
        }

        .content h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .content p {
            font-size: 15px;
            line-height: 1.6;
            margin: 12px 0;
        }

        .button {
            display: inline-block;
            background-color: #0B2638;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: 600;
            margin: 24px 0;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #092030;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.05em;
        }

        .logo-inti {
            color: #F9B11F;
        }

        .logo-gear {
            color: #0B2638;
        }

        .footer {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            padding: 16px;
        }

        .link {
            color: #0B2638;
            text-decoration: none;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="logo"><span class="logo-inti">Inti</span><span class="logo-gear">Gear</span></h1>
    </div>
    <div class="content">
        <h2>¡Hola {{ user.first_name }}!</h2>
        <p>Gracias por registrarte en <strong>Korena</strong>.</p>
        <a data-testid="activate_account_button" class="button" href="{{ activation_url }}">Activar mi cuenta</a>
        <p>Si el botón no funciona, copia y pega este enlace en tu navegador:</p>
        <p><a class="link" href="{{ activation_url }}">{{ activation_url }}</a></p>
    </div>
    <div class="footer">
        &copy; {% now "Y" %} Korena. Todos los derechos reservados.
    </div>
</div>
</body>
</html>
